# 443 포트(HTTPS)로 받아 Spring(5000 포트)으로 넘긴다.
# 인증서는 Cloudflare 원본 인증서다. Cloudflare만 믿는 인증서라, 브라우저는 Cloudflare를 거쳐서 접속한다.
# 인증서 파일은 .platform/hooks/prebuild/01_tls_certificate.sh가 S3에서 내려받는다.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/pki/tls/certs/origin.crt;
    ssl_certificate_key /etc/pki/tls/private/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 5m;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
