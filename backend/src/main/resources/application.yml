# 공통 설정. 로컬, 운영, 테스트 모두 이 파일을 읽고, 프로필별 파일(application-<프로필>.yml)이 덮어쓴다.
# 주소는 환경 변수가 없으면 로컬 기본값을 쓴다. 비밀 값은 기본값이 없어서, 설정하지 않으면 서버가 켜지지 않는다.
spring:
  profiles:
    # 프로필을 지정하지 않고 실행하면 local 프로필 (backend/application-local.yml)
    default: local
  datasource:
    # 로컬은 H2 메모리 DB. 운영(prod)은 환경 변수로 MySQL을 지정한다 (5-2)
    # MODE=MySQL: 운영 DB(MySQL)와 같은 SQL이 돌도록 H2를 MySQL 호환 모드로 띄운다
    url: ${DB_URL:jdbc:h2:mem:testdb;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # 테이블은 Flyway(db/migration의 SQL)가 만든다. Hibernate는 엔티티와 테이블이 맞는지 검사만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # 시각은 UTC로 저장한다
          time_zone: UTC
  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}
  # blog 화면(Next.js)이 요청을 넘겨줄 때 붙이는 X-Forwarded-Host/Proto를 보고,
  # 사용자가 접속한 주소 기준으로 리다이렉트 주소와 redirect_uri를 만든다.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # 같은 컴퓨터에서 실행하는 accounts(ACCOUNTS_SESSION)와 구별하기 위해 이름을 정한다.
        name: BLOG_SESSION

# 로그인을 맡기는 인가 서버(accounts). blog는 여기에 등록된 OIDC 클라이언트다.
accounts:
  # 브라우저가 가는 주소 (accounts 화면). ID 토큰의 iss와 같아야 한다.
  issuer: ${ACCOUNTS_ISSUER:http://localhost:3001}
  # blog 서버가 직접 부르는 주소 (토큰 교환, 서명 공개 키)
  backchannel-uri: ${ACCOUNTS_BACKCHANNEL_URI:http://localhost:9000}
  client-id: ${ACCOUNTS_CLIENT_ID:blog}
  # accounts의 BLOG_CLIENT_SECRET과 같은 값
  client-secret: ${ACCOUNTS_CLIENT_SECRET}
