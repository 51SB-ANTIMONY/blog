plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.antimony'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2' // In-memory DB (로컬, 테스트)
    runtimeOnly 'com.mysql:mysql-connector-j' // 운영 DB
    // DB 테이블을 SQL 스크립트로 관리 (src/main/resources/db/migration)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    // 세션을 서버 메모리 대신 DB에 저장 (재시작해도 로그인 유지)
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    // 상태 확인 주소 /actuator/health (로드밸런서의 헬스 체크용)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트는 test 프로필(src/test/resources/application-test.yml)로 실행한다. 로컬 비밀 값 파일에 기대지 않는다.
    systemProperty 'spring.profiles.active', 'test'
}

// Elastic Beanstalk에 올릴 묶음(build/distributions/blog-eb.zip): JAR + Procfile + 배포 설정(.platform, .ebextensions)
tasks.register('ebBundle', Zip) {
    group = 'build'
    description = 'Elastic Beanstalk 배포 묶음을 만든다'
    archiveFileName = "${project.name}-eb.zip"
    from(tasks.named('bootJar')) {
        rename { 'application.jar' }
    }
    from('Procfile')
    from('.platform') {
        into '.platform'
        // 배포 훅(hooks: 코드 배포, confighooks: 설정 변경)은 실행 권한이 있어야 Elastic Beanstalk이 실행한다
        filesMatching('**/*.sh') {
            permissions { unix('rwxr-xr-x') }
        }
    }
    from('.ebextensions') {
        into '.ebextensions'
    }
}
