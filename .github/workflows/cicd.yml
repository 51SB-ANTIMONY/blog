name: CI/CD

on:
  push:
    branches: [main]

# 배포가 겹치지 않게 한 번에 하나씩 실행한다
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP: blog

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'gradle'

      - name: Test and build
        run: ./gradlew clean test bootJar

      # Lightsail 서버에 JAR를 올리고 배포 스크립트(/usr/local/bin/antimony-deploy)를 실행한다.
      # 스크립트는 헬스 체크가 UP이 될 때까지 기다리고, 실패하면 이전 JAR로 되돌린 뒤 실패로 끝난다.
      - name: Deploy to Lightsail
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          jar=$(ls build/libs/*.jar | grep -v -- '-plain\.jar$')
          scp -i ~/.ssh/deploy_key "$jar" "deploy@$HOST:incoming/$APP.jar"
          ssh -i ~/.ssh/deploy_key "deploy@$HOST" sudo /usr/local/bin/antimony-deploy "$APP"
