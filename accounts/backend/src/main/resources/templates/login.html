<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">

    <style>
        .gradient-custom {
          background: linear-gradient(to right, rgba(106, 17, 203, 1), rgba(37, 117, 252, 1))
        }
    </style>
</head>
<body class="gradient-custom">
<section class="d-flex vh-100">
    <div class="container-fluid row justify-content-center align-content-center">
        <div class="card bg-dark" style="border-radius: 1rem;">
            <div class="card-body p-5 text-center">
                <h2 class="text-white">LOGIN</h2>
                <p class="text-white-50 mt-2 mb-5">서비스를 사용하려면 로그인을 해주세요!</p>

                <div class = "mb-2">
                    <p class="text-danger" th:if="${param.error}">아이디 또는 비밀번호를 확인해 주세요.</p>
                    <p class="text-white-50" th:if="${param.logout}">로그아웃되었습니다.</p>
                    <p class="text-danger" th:if="${param.social_error}" th:switch="${param.social_error[0]}">
                        <span th:case="'email_already_registered'">이미 같은 이메일로 가입한 계정이 있습니다. 기존 계정으로 로그인한 뒤 소셜 계정을 연결해 주세요.</span>
                        <span th:case="'linked_to_another_user'">이 소셜 계정은 이미 다른 회원에 연결되어 있습니다.</span>
                        <span th:case="*">소셜 로그인에 실패했습니다.</span>
                    </p>
                    <form action="/login" method="POST">
                        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
                        <div class="mb-3">
                            <label class="form-label text-white">ID</label>
                            <input type="text" class="form-control" name="username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">Password</label>
                            <input type="password" class="form-control" name="password">
                        </div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>

                    <button type="button" class="btn btn-secondary mt-3" onclick="location.href='/signup'">회원가입</button>

                    <div class="mt-4">
                        <a href="/oauth2/authorization/google">
                            <img src="/img/google.png" alt="Google로 로그인">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
